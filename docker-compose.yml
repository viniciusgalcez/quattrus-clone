services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-quattrus}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-quattrus}
      - POSTGRES_DB=${POSTGRES_DB:-quattrus}
    ports:
      # Bound to loopback only: the database must not be reachable from the
      # network. Remove this mapping entirely in production.
      - "127.0.0.1:5432:5432"
    volumes:
      - quattrus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-quattrus} -d ${POSTGRES_DB:-quattrus}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-quattrus}:${POSTGRES_PASSWORD:-quattrus}@postgres:5432/${POSTGRES_DB:-quattrus}
      # Required by NextAuth v5. Sourced from the host environment so compose
      # fails loudly here instead of every request 500ing at runtime.
      - "AUTH_SECRET=${AUTH_SECRET:?AUTH_SECRET is required - generate one with `openssl rand -base64 32`}"
      - AUTH_TRUST_HOST=${AUTH_TRUST_HOST:-true}
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      # Generous start period: the container runs `prisma migrate deploy`
      # before the server comes up.
      start_period: 60s

volumes:
  quattrus_postgres_data:
