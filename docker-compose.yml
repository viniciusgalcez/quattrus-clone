services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-quattrus}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-quattrus}
      - POSTGRES_DB=${POSTGRES_DB:-quattrus}
    ports:
      # Bound to loopback only: the database must not be reachable from the
      # network. Remove this mapping entirely in production. Host port is
      # configurable (POSTGRES_PORT) so a second stack (e.g. a prod instance
      # alongside a dev one) can run on the same machine without clashing.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - quattrus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-quattrus} -d ${POSTGRES_DB:-quattrus}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: migrator
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-quattrus}:${POSTGRES_PASSWORD:-quattrus}@postgres:5432/${POSTGRES_DB:-quattrus}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      target: runner
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-quattrus}:${POSTGRES_PASSWORD:-quattrus}@postgres:5432/${POSTGRES_DB:-quattrus}
      # Required by NextAuth v5. Sourced from the host environment so compose
      # fails loudly here instead of every request 500ing at runtime.
      - "AUTH_SECRET=${AUTH_SECRET:?AUTH_SECRET is required - generate one with `openssl rand -base64 32`}"
      - AUTH_TRUST_HOST=${AUTH_TRUST_HOST:-true}
      # Optional: enables GET /api/cron/purge-archived for an external
      # schedule (host cron) to sweep archived KPIs past their 1-year
      # retention. Leave unset to rely only on the lazy sweep that runs
      # whenever an admin opens /metas/arquivados.
      - CRON_SECRET=${CRON_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: always
    volumes:
      - quattrus_uploads:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  quattrus_postgres_data:
  quattrus_uploads:
